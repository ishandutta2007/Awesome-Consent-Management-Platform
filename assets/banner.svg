<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .floating-shape {
      animation: float 6s ease-in-out infinite;
    }
    .pulse-glow {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.7; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="350" fill="url(#grid)" rx="16"/>

  <!-- Dynamic / Animated Background Lights & Waves (Positioned safely behind/around content) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="blur(60px)" class="pulse-glow" opacity="0.25"/>
  <circle cx="1050" cy="270" r="160" fill="#c084fc" filter="blur(70px)" class="pulse-glow" opacity="0.3"/>
  <circle cx="900" cy="70" r="100" fill="#ec4899" filter="blur(50px)" class="pulse-glow" opacity="0.2"/>

  <!-- Background Decorative Shield Lines -->
  <path d="M 1000 60 Q 1080 120 1080 200 Q 1080 280 1000 310 Q 920 280 920 200 Q 920 120 1000 60 Z" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" stroke-dasharray="6,6" />
  
  <!-- Floating Lock & Shield Vector Graphic on Right Side -->
  <g class="floating-shape" style="transform-origin: 1000px 185px;">
    <!-- Outer Shield -->
    <path d="M 1000 100 L 1060 130 V 190 C 1060 235 1000 265 1000 265 C 1000 265 940 235 940 190 V 130 Z" fill="rgba(30, 27, 75, 0.6)" stroke="url(#titleGrad)" stroke-width="3" filter="url(#shadow)"/>
    <!-- Keyhole / Check Icon inside Shield -->
    <path d="M 985 185 L 995 195 L 1018 170" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Content Container (Ensures title/subtitle never covered) -->
  <g transform="translate(70, 0)">

    <!-- Top Badge Pill -->
    <g transform="translate(0, 65)">
      <rect width="250" height="32" rx="16" fill="url(#pillGrad)"/>
      <text x="125" y="21" text-anchor="middle" class="badge-text">PRIVACY &amp; COMPLIANCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" class="title" filter="url(#shadow)">
      Awesome Consent Management Platform
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="195" class="subtitle">
      Curated SaaS Products, Enterprise CMPs &amp; Open-Source Privacy Frameworks
    </text>

    <!-- Feature Tags Container -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <text x="70" y="22" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="14" font-weight="600">🍪 Cookie Consent</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="155" height="34" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <text x="77" y="22" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="14" font-weight="600">🛡️ GDPR / CCPA</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(325, 0)">
        <rect width="180" height="34" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <text x="90" y="22" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="14" font-weight="600">⚡ Consent Mode v2</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(520, 0)">
        <rect width="160" height="34" rx="8" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="14" font-weight="600">💻 Open-Source</text>
      </g>
    </g>

  </g>
</svg>
